<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 410" role="img"><rect width="640" height="410" rx="22" fill="#eef2f8"/><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#33415c"/></marker></defs><rect x="170" y="20" width="300" height="52" rx="14" fill="#1f3b6e"/><text x="320.0" y="40.0" text-anchor="middle" font-size="17" font-weight="700" fill="#fff" font-family="Atkinson Hyperlegible, Arial, sans-serif">La démocratie libérale</text><text x="320.0" y="58.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#fff" font-family="Atkinson Hyperlegible, Arial, sans-serif">trois principes</text><path d="M320,74 L120,112" stroke="#33415c" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M320,74 L320,112" stroke="#33415c" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M320,74 L520,112" stroke="#33415c" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="20" y="116" width="200" height="96" rx="14" fill="#2f8a8a"/><text x="120.0" y="150.0" text-anchor="middle" font-size="15" font-weight="700" fill="#fff" font-family="Atkinson Hyperlegible, Arial, sans-serif">1. L'individu</text><text x="120.0" y="168.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#fff" font-family="Atkinson Hyperlegible, Arial, sans-serif">primauté de l'individu,</text><text x="120.0" y="184.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#fff" font-family="Atkinson Hyperlegible, Arial, sans-serif">égalité en droit</text><rect x="230" y="116" width="180" height="96" rx="14" fill="#4a7fb5"/><text x="320.0" y="150.0" text-anchor="middle" font-size="15" font-weight="700" fill="#fff" font-family="Atkinson Hyperlegible, Arial, sans-serif">2. La liberté</text><text x="320.0" y="168.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#fff" font-family="Atkinson Hyperlegible, Arial, sans-serif">liberté politique,</text><text x=