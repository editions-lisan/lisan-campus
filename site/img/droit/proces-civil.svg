<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 640" role="img" aria-label="Schéma simplifié d’un procès civil"><rect width="480" height="640" rx="22" fill="#eef2f8"/><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#33415c"/></marker></defs><text x="240" y="34" text-anchor="middle" font-size="16" font-weight="700" fill="#33415c" font-family="Atkinson Hyperlegible, Arial, sans-serif">Schéma simplifié d’un procès civil</text><rect x="16" y="60" width="196" height="132" rx="14" fill="#fff" stroke="#2f6db5" stroke-width="2"/><path d="M16 74a14 14 0 0 1 14-14h168a14 14 0 0 1 14 14v62H16z" fill="#2f6db5"/><text x="114" y="82" text-anchor="middle" font-size="15" font-weight="700" fill="#fff" font-family="Atkinson Hyperlegible, Arial, sans-serif">Tribunal de première</text><text x="114" y="100" text-anchor="middle" font-size="15" font-weight="700" fill="#fff" font-family="Atkinson Hyperlegible, Arial, sans-serif">instance (ou section</text><text x="114" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="#fff" font-family="Atkinson Hyperlegible, Arial, sans-serif">détachée)</text><text x="30" y="158" text-anchor="start" font-size="14" font-weight="400" fill="#33415c" font-family="Atkinson Hyperlegible, Arial, sans-serif">Pierre : demandeur</text><text x="30" y="178" text-anchor="start" font-size="14" font-weight="400" fill="#33415c" font-family="Atkinson Hyperlegible, Arial, sans-serif">Jean : défendeur</text><text x="346" y="64" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2f6db5" font-family="Atkinson Hyperlegible, Arial, sans-serif">rend un JUGEMENT</text><rect x="250" y="76" width="214" height="56" rx="12" fill="#fff" stroke="#c9d3e6"/><text x="357" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#33415c" font-family="Atkinson Hyperlegible, Arial, sans-serif">Déboute Pierre</text><text x="357" y="119" text-anchor="middle" font-size="12.5" font-weight="400" fill="#5b6b88" font-style="italic" font-family="Atkinson Hyperlegible, Arial, sans-serif">(demande rejetée)</text><path d="M212 126 C 232 126, 230 104, 246 104" fill="none" stroke="#33415c" stroke-width="1.6" marker-end="url(#a)"/><rect x="250" y="148" width="214" height="56" rx="12" fill="#fff" stroke="#c9d3e6"/><text x="357" y="172" text-anchor="middle" font-size="14" font-weight="700" fill="#33415c" font-family="Atkinson Hyperlegible, Arial, sans-serif">Fait droit à Pierre</text><text x="357" y="191" text-anchor="middle" font-size="12.5" font-weight="400" fill="#5b6b88" font-style="italic" font-family="Atkinson Hyperlegible, Arial, sans-serif">(Jean est condamné)</text><path d="M212 126 C 232 126, 230 176, 246 176" fill="none" stroke="#33415c" stroke-width="1.6" marker-end="url(#a)"/><text x="357" y="144" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6b88" font-family="Atkinson Hyperlegible, Arial, sans-serif">ou</text><path d="M114 196 V 244" stroke="#33415c" stroke-width="2" marker-end="url(#a)"/><rect x="46.4" y="209" width="135" height="24" rx="12" fill="#eef2f8"/><text x="114" y="226.0" text-anchor="middle" font-size="13" font-weight="700" fill="#33415c" font-family="Atkinson Hyperlegible, Arial, sans-serif">Interjeter appel</text><rect x="16" y="250" width="196" height="96" rx="14" fill="#fff" stroke="#6b5ca5" stroke-width="2"/><path d="M16 264a14 14 0 0 1 14-14h168a14 14 0 0 1 14 14v26H16z" fill="#6b5ca5"/><text x="114" y="272" text-anchor="middle" font-size="15" font-weight="700" fill="#fff" font-family="Atkinson Hyperlegible, Arial, sans-serif">Cour d’appel</text><text x="30" y="312" text-anchor="start" font-size="14" font-weight="400" fill="#33415c" font-family="Atkinson Hyperlegible, Arial, sans-serif">Appelant</text><text x="30" y="332" text-anchor="start" font-size="14" font-weight="400" fill="#33415c" font-family="Atkinson Hyperlegible, Arial, sans-serif">Intimé</text><text x="346" y="254" text-anchor="middle" font-size="12.5" font-weight="700" fill="#6b5ca5" font-family="Atkinson Hyperlegible, Arial, sans-serif">rend un ARRÊT</text><rect x="250" y="266" width="214" height="56" rx="12" fill="#fff" stroke="#c9d3e6"/><text x="357" y="290" text-anchor="middle" font-size="14" font-weight="700" fill="#33415c" font-family="Atkinson Hyperlegible, Arial, sans-serif">Confirme le jugement</text><text x="357" y="309" text-anchor="middle" font-size="12.5" font-weight="400" fill="#5b6b88" font-style="italic" font-family="Atkinson Hyperlegible, Arial, sans-serif">(arrêt confirmatif)</text><path d="M212 298 C 232 298, 230 294, 246 294" fill="none" stroke="#33415c" stroke-width="1.6" marker-end="url(#a)"/><rect x="250" y="338" width="214" height="56" rx="12" fill="#fff" stroke="#c9d3e6"/><text x="357" y="362" text-anchor="middle" font-size="14" font-weight="700" fill="#33415c" font-family="Atkinson Hyperlegible, Arial, sans-serif">Infirme le jugement</text><text x="357" y="381" text-anchor="middle" font-size="12.5" font-weight="400" fill="#5b6b88" font-style="italic" font-family="Atkinson Hyperlegible, Arial, sans-serif">(arrêt infirmatif)</text><path d="M212 298 C 232 298, 230 366, 246 366" fill="none" stroke="#33415c" stroke-width="1.6" marker-end="url(#a)"/><text x="357" y="334" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6b88" font-family="Atkinson Hyperlegible, Arial, sans-serif">ou</text><path d="M114 350 V 434" stroke="#33415c" stroke-width="2" marker-end="url(#a)"/><rect x="-4.0" y="381" width="236" height="24" rx="12" fill="#eef2f8"/><text x="114" y="398.0" text-anchor="middle" font-size="13" font-weight="700" fill="#33415c" font-family="Atkinson Hyperlegible, Arial, sans-serif">Former un pourvoi en cassation</text><rect x="16" y="440" width="196" height="96" rx="14" fill="#fff" stroke="#b5544a" stroke-width="2"/><path d="M16 454a14 14 0 0 1 14-14h168a14 14 0 0 1 14 14v26H16z" fill="#b5544a"/><text x="114" y="462" text-anchor="middle" font-size="15" font-weight="700" fill="#fff" font-family="Atkinson Hyperlegible, Arial, sans-serif">Cour de cassation</text><text x="30" y="502" text-anchor="start" font-size="14" font-weight="400" fill="#33415c" font-family="Atkinson Hyperlegible, Arial, sans-serif">Demandeur au pourvoi</text><text x="30" y="522" text-anchor="start" font-size="14" font-weight="400" fill="#33415c" font-family="Atkinson Hyperlegible, Arial, sans-serif">Défendeur au pourvoi</text><text x="346" y="444" text-anchor="middle" font-size="12.5" font-weight="700" fill="#b5544a" font-family="Atkinson Hyperlegible, Arial, sans-serif">rend un ARRÊT</text><rect x="250" y="456" width="214" height="56" rx="12" fill="#fff" stroke="#c9d3e6"/><text x="357" y="480" text-anchor="middle" font-size="14" font-weight="700" fill="#33415c" font-family="Atkinson Hyperlegible, Arial, sans-serif">Casse la décision</text><text x="357" y="499" text-anchor="middle" font-size="12.5" font-weight="400" fill="#5b6b88" font-style="italic" font-family="Atkinson Hyperlegible, Arial, sans-serif">(arrêt de cassation)</text><path d="M212 488 C 232 488, 230 484, 246 484" fill="none" stroke="#33415c" stroke-width="1.6" marker-end="url(#a)"/><rect x="250" y="528" width="214" height="56" rx="12" fill="#fff" stroke="#c9d3e6"/><text x="357" y="552" text-anchor="middle" font-size="14" font-weight="700" fill="#33415c" font-family="Atkinson Hyperlegible, Arial, sans-serif">Rejette le pourvoi</text><text x="357" y="571" text-anchor="middle" font-size="12.5" font-weight="400" fill="#5b6b88" font-style="italic" font-family="Atkinson Hyperlegible, Arial, sans-serif">(arrêt de rejet)</text><path d="M212 488 C 232 488, 230 556, 246 556" fill="none" stroke="#33415c" stroke-width="1.6" marker-end="url(#a)"/><text x="357" y="524" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6b88" font-family="Atkinson Hyperlegible, Arial, sans-serif">ou</text><text x="240" y="624" text-anchor="middle" font-size="11" font-weight="400" fill="#5b6b88" font-style="italic" font-family="Atkinson Hyperlegible, Arial, sans-serif">La partie qui perd peut exercer un recours ; les parties changent de nom à chaque degré.</text></svg>