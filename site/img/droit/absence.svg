<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 466" role="img"><rect width="480" height="466" rx="22" fill="#eef2f8"/><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#33415c"/></marker></defs><rect x="24" y="20" width="432" height="62" rx="14" fill="#33415c"/><text x="44" y="48" font-size="19" font-weight="700" fill="#fff" font-family="Atkinson Hyperlegible, Arial, sans-serif">Dernières nouvelles</text><text x="44" y="72" font-size="15"  fill="#fff" font-family="Atkinson Hyperlegible, Arial, sans-serif">point de départ des délais</text><path d="M240,84 L240,108" stroke="#33415c" stroke-width="2.5" marker-end="url(#a)"/><rect x="24" y="112" width="432" height="84" rx="14" fill="#4a7fb5"/><text x="44" y="140" font-size="19" font-weight="700" fill="#fff" font-family="Atkinson Hyperlegible, Arial, sans-serif">Après 1 an</text><text x="44" y="164" font-size="15"  fill="#fff" font-family="Atkinson Hyperlegible, Arial, sans-serif">requête, puis jugement de présomption</text><text x="44" y="186" font-size="15"  fill="#fff" font-family="Atkinson Hyperlegible, Arial, sans-serif">d'absence ; un administrateur gère les biens</text><path d="M240,198 L240,222" stroke="#33415c" stroke-width="2.5" marker-end="url(#a)"/><rect x="24" y="226" width="432" height="84" rx="14" fill="#c8962e"/><text x="44" y="254" font-size="19" font-weight="700" fill="#fff" font-family="Atkinson Hyperlegible, Arial, sans-serif">Après 2 ans d'enquête</text><text x="44" y="278" font-size="15"  fill="#fff" font-family="Atkinson Hyperlegible, Arial, sans-serif">jugement déclaratif d'absence ; le mariage</text><text x="44" y="300" font-size="15"  fill="#fff" font-family="Atkinson Hyperlegible, Arial, sans-serif">est dissous</text><path d="M240,312 L240,336" stroke="#33415c" stroke-width="2.5" marker-end="url(#a)"/><rect x="24" y="340" width="432" height="106" rx="14" fill="#b5544a"/><text x="44" y="368" font-size="19" font-weight="700" fill="#fff" font-family="Atkinson Hyperlegible, Arial, sans-serif">7 ans après ce jugement</text><text x="44" y="392" font-size="15"  fill="#fff" font-family="Atkinson Hyperlegible, Arial, sans-serif">ou 10 ans après les dernières nouvelles.</text><text x="44" y="414" font-size="15"  fill="#fff" font-family="Atkinson Hyperlegible, Arial, sans-serif">Jugement déclaratif de décès ; la succession</text><text x="44" y="436" font-size="15"  fill="#fff" font-family="Atkinson Hyperlegible, Arial, sans-serif">s'ouvre</text></svg>